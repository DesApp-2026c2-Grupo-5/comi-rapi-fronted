<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff9f1c" />
    <meta
      name="description"
      content="Comi-Rapi: pedidos de comida a domicilio. Elegí tu sucursal, armá el pedido y seguí su estado en tiempo real."
    />
    <link rel="icon" type="image/svg+xml" href="/imagenes/logo-comirapi.svg" />
    <!-- Tipografía de marca: Outfit para títulos, Inter para el cuerpo.
         preconnect reduce el viaje de red a los servidores de fuentes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Comi-Rapi</title>
    <!-- Splash de carga inicial: se pinta antes de que llegue el bundle JS/CSS
         (por eso el CSS va inline) y lo oculta main.jsx al montar React.
         Fondo crema + logo de marca, sin spinner circular. -->
    <style>
      .splash-inicial {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: #fff4e2;
        transition: opacity 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .splash-inicial--sale {
        opacity: 0;
        pointer-events: none;
      }
      .splash-inicial img {
        width: 72px;
        height: 72px;
        animation: splash-entrada 500ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      .splash-inicial__nombre {
        margin: 0;
        font-family: 'Outfit', system-ui, sans-serif;
        font-weight: 800;
        font-size: 1.4rem;
        letter-spacing: 2px;
        color: #b55d00;
      }
      /* Bootstrap (con .visually-hidden) todavía no cargó: el texto de estado
         se oculta con las reglas clásicas de recorte para lectores de pantalla. */
      .splash-inicial .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @keyframes splash-entrada {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
      }
      /* Con movimiento reducido no hay entrada animada ni transición de salida:
         el splash desaparece de forma instantánea (pocos y suaves, nunca nada). */
      @media (prefers-reduced-motion: reduce) {
        .splash-inicial,
        .splash-inicial img {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Ir al contenido principal</a>
    <div id="root"></div>
    <div class="splash-inicial" role="status" aria-live="polite">
      <img src="/imagenes/logo-comirapi.svg" alt="" />
      <p class="splash-inicial__nombre">COMI RAPI</p>
      <span class="visually-hidden">Cargando la aplicación…</span>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
