<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Comi-Rapi">
  <!-- Monograma de marca: hamburguesa estilizada + trazo de velocidad.
       Círculo crema como base; pan, lechuga y carne en naranja; dos líneas
       de velocidad a la izquierda comunican "rapi". -->
  <circle cx="34" cy="32" r="30" fill="#fff4e2"/>
  <!-- Trazos de velocidad -->
  <rect x="4" y="24" width="14" height="4" rx="2" fill="#ff9f1c" opacity="0.55"/>
  <rect x="1" y="34" width="12" height="4" rx="2" fill="#ff9f1c" opacity="0.35"/>
  <!-- Pan superior -->
  <path d="M20 26c0-7 6.3-11 14-11s14 4 14 11c0 1.1-.9 2-2 2H22c-1.1 0-2-.9-2-2z" fill="#ff9f1c"/>
  <!-- Semillas -->
  <circle cx="29" cy="20.5" r="1.3" fill="#fff4e2"/>
  <circle cx="36" cy="19" r="1.3" fill="#fff4e2"/>
  <circle cx="42" cy="21.5" r="1.3" fill="#fff4e2"/>
  <!-- Lechuga -->
  <path d="M19.5 30.5c1.8 0 1.8 2.2 3.6 2.2s1.8-2.2 3.7-2.2 1.8 2.2 3.7 2.2 1.8-2.2 3.6-2.2 1.9 2.2 3.7 2.2 1.8-2.2 3.7-2.2 1.8 2.2 3.6 2.2v3H19.5z" fill="#2b2b2b"/>
  <!-- Carne -->
  <rect x="20" y="36" width="28" height="6" rx="3" fill="#b55d00"/>
  <!-- Pan inferior -->
  <path d="M20 45h28c1.1 0 2 .9 2 2 0 3.3-3.1 5-16 5s-16-1.7-16-5c0-1.1.9-2 2-2z" fill="#ff9f1c"/>
</svg>
